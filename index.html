<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Purple Gallery Favicon -->
    <link rel="icon" type="image/jpeg" href="/purple.jpg" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Website Title -->
    <title>Purple Gallery | Fashion & Lifestyle</title>

    <!-- SEO Meta Description -->
    <meta
      name="description"
      content="Purple Gallery - Discover fashion, accessories, bags, home decor, gifts and antiques."
    />

    <!-- Website Name -->
    <meta
      name="application-name"
      content="Purple Gallery"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#7c3aed"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="Purple Gallery | Fashion & Lifestyle"
    />

    <meta
      property="og:description"
      content="Discover fashion, accessories, bags, home decor, gifts and antiques at Purple Gallery."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Purple Gallery"
    />

    <meta
      property="og:image"
      content="/purple.jpg"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
